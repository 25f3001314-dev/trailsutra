<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrailSutra | Login</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f3f5f9;color:#1b2430}
  .bar{background:#14213d;color:#fff;padding:14px 24px;font-weight:600;font-size:18px}
  .bar small{font-weight:400;opacity:.7;margin-left:10px}
  .wrap{max-width:760px;margin:40px auto;padding:0 16px}
  h2{margin:0 0 6px}
  p.sub{margin:0 0 22px;color:#5b6573}
  .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .tab{background:#fff;border:2px solid #d9dee7;border-radius:12px;padding:16px;cursor:pointer;text-align:left;font:inherit}
  .tab b{display:block;font-size:16px}
  .tab span{font-size:12px;color:#5b6573}
  .tab.active{border-color:#2563eb;background:#eef4ff}
  .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
  .who{font-size:15px}
  .who code{background:#eef1f6;padding:2px 8px;border-radius:6px}
  button.go{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px 28px;font-size:16px;font-weight:600;cursor:pointer}
  button.go:hover{background:#1d4ed8}
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:16px}
  .err{background:#fde8e8;color:#9b1c1c}
  .ok{background:#e6f6ea;color:#1e6b34}
  .note{margin-top:18px;font-size:12px;color:#8a93a1}
</style>
</head>
<body>
<div class="bar">TrailSutra<small>Investigation Support</small></div>
<div class="wrap">
  <h2>Select a role</h2>

  <div class="msg err" th:if="${param.error}">Login failed. The username or password is incorrect.</div>
  <div class="msg ok" th:if="${param.logout}">You have been logged out.</div>

  <div class="tabs" id="tabs"></div>

  <form class="card" method="post" th:action="@{/login}">
    <input type="hidden" name="username" id="u">
    <input type="hidden" name="password" id="p">
    <div class="row">
      <div class="who">Logging in as <code id="who"></code> <span id="role" style="color:#5b6573"></span></div>
      <button type="submit" class="go">Login Now</button>
    </div>
  </form>
  <div class="note"></div>
</div>
<script>
  var USERS=[
    {u:"officer",p:"ChangeMeOfficer42!",label:"Officer",role:"Investigating Officer"},
    {u:"reviewer",p:"ChangeMeReviewer42!",label:"Reviewer",role:"Reviewer"},
    {u:"auditor",p:"ChangeMeAuditor42!",label:"Auditor",role:"Auditor"},
    {u:"bank-analyst",p:"ChangeMeBank42!",label:"Bank Analyst",role:"Bank Analyst"}
  ];
  var tabs=document.getElementById("tabs");
  function pick(i){
    var x=USERS[i];
    document.getElementById("u").value=x.u;
    document.getElementById("p").value=x.p;
    document.getElementById("who").textContent=x.u;
    document.getElementById("role").textContent="("+x.role+")";
    Array.prototype.forEach.call(tabs.children,function(t,j){t.classList.toggle("active",i===j)});
  }
  USERS.forEach(function(x,i){
    var b=document.createElement("button");
    b.type="button";b.className="tab";
    b.innerHTML="<b>"+x.label+"</b><span>"+x.u+"</span>";
    b.onclick=function(){pick(i)};
    tabs.appendChild(b);
  });
  pick(0);
</script>
</body>
</html>
